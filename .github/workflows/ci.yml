name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package
        run: pip install -e .

      - name: Parse, resolve, generate (25 samples)
        run: python tools/check_rules.py --samples 25
